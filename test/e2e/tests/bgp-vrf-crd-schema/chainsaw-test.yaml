apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bgp-vrf-crd-schema
spec:
  description: >
    Verify schema validation, storage, and CEL rules for BGPVRFInstance CRDs.
    Tests that valid resources are accepted and stored, invalid resources are
    rejected by the API server, and all required fields are enforced.
    Does not require the BGP operator to be running — CRD schema is enforced
    by the API server alone.
  steps:
    - name: create-valid-vrf
      try:
        - apply:
            resource:
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-valid-vrf
              spec:
                routerRef:
                  name: bgp-e2e-worker
                vrfID: 100
                importRouteTargets:
                  - value: "65000:100"
                exportRouteTargets:
                  - value: "65000:100"

    - name: assert-vrf-stored
      try:
        - assert:
            resource:
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-valid-vrf
              (metadata.name): e2e-valid-vrf

    - name: verify-vrf-fields
      try:
        - script:
            content: |
              set -e
              VRFID=$(kubectl get bgpvrf e2e-valid-vrf -n "$NAMESPACE" \
                -o jsonpath='{.spec.vrfID}')
              IRT=$(kubectl get bgpvrf e2e-valid-vrf -n "$NAMESPACE" \
                -o jsonpath='{.spec.importRouteTargets[0].value}')
              ERT=$(kubectl get bgpvrf e2e-valid-vrf -n "$NAMESPACE" \
                -o jsonpath='{.spec.exportRouteTargets[0].value}')
              ROUTER=$(kubectl get bgpvrf e2e-valid-vrf -n "$NAMESPACE" \
                -o jsonpath='{.spec.routerRef.name}')
              if [ "$VRFID" != "100" ]; then
                echo "ERROR: vrfID = $VRFID, want 100"
                exit 1
              fi
              if [ "$IRT" != "65000:100" ]; then
                echo "ERROR: importRouteTargets[0].value = $IRT, want 65000:100"
                exit 1
              fi
              if [ "$ERT" != "65000:100" ]; then
                echo "ERROR: exportRouteTargets[0].value = $ERT, want 65000:100"
                exit 1
              fi
              if [ "$ROUTER" != "bgp-e2e-worker" ]; then
                echo "ERROR: routerRef.name = $ROUTER, want bgp-e2e-worker"
                exit 1
              fi
              echo "OK: all fields stored correctly (vrfID=$VRFID IRT=$IRT ERT=$ERT routerRef.name=$ROUTER)"

    - name: vrf-id-boundary-values
      try:
        - script:
            content: |
              set -e
              kubectl apply -f - <<EOF
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-vrf-id-max
              spec:
                routerRef:
                  name: bgp-e2e-worker
                vrfID: 65535
                importRouteTargets:
                  - value: "65000:100"
                exportRouteTargets:
                  - value: "65000:100"
              EOF
              kubectl delete bgpvrf e2e-vrf-id-max
              echo "OK: maximum vrfID (65535) accepted"

    - name: vrf-multiple-route-targets
      try:
        - script:
            content: |
              set -e
              kubectl apply -f - <<EOF
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-vrf-multi-rt
              spec:
                routerRef:
                  name: bgp-e2e-worker
                vrfID: 200
                importRouteTargets:
                  - value: "65000:200"
                  - value: "65001:200"
                exportRouteTargets:
                  - value: "65000:200"
                  - value: "65001:200"
              EOF
              IRT_COUNT=$(kubectl get bgpvrf e2e-vrf-multi-rt \
                -o jsonpath='{range .spec.importRouteTargets[*]}{.value}{"\n"}{end}' | wc -l | tr -d ' ')
              ERT_COUNT=$(kubectl get bgpvrf e2e-vrf-multi-rt \
                -o jsonpath='{range .spec.exportRouteTargets[*]}{.value}{"\n"}{end}' | wc -l | tr -d ' ')
              kubectl delete bgpvrf e2e-vrf-multi-rt
              if [ "$IRT_COUNT" -ne 2 ] || [ "$ERT_COUNT" -ne 2 ]; then
                echo "ERROR: expected 2 import and 2 export RTs, got import=$IRT_COUNT export=$ERT_COUNT"
                exit 1
              fi
              echo "OK: multiple route targets stored correctly (import=$IRT_COUNT export=$ERT_COUNT)"

    - name: reject-reserved-vrfid-zero
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-vrf-id-zero
              spec:
                routerRef:
                  name: bgp-e2e-worker
                vrfID: 0
                importRouteTargets:
                  - value: "65000:100"
                exportRouteTargets:
                  - value: "65000:100"
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: expected rejection of reserved vrfID 0 but resource was accepted"
                kubectl delete bgpvrf e2e-vrf-id-zero 2>/dev/null || true
                exit 1
              fi
              echo "OK: reserved vrfID 0 correctly rejected"
              echo "Server response: $OUTPUT"

    - name: reject-vrfid-above-max
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-vrf-id-toobig
              spec:
                routerRef:
                  name: bgp-e2e-worker
                vrfID: 65536
                importRouteTargets:
                  - value: "65000:100"
                exportRouteTargets:
                  - value: "65000:100"
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: expected rejection of vrfID above 65535 but resource was accepted"
                kubectl delete bgpvrf e2e-vrf-id-toobig 2>/dev/null || true
                exit 1
              fi
              echo "OK: vrfID above 65535 correctly rejected"
              echo "Server response: $OUTPUT"

    - name: reject-invalid-rt-format
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-vrf-bad-rt
              spec:
                routerRef:
                  name: bgp-e2e-worker
                vrfID: 100
                importRouteTargets:
                  - value: "bad-rt"
                exportRouteTargets:
                  - value: "65000:100"
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: expected rejection of invalid importRouteTarget value but resource was accepted"
                kubectl delete bgpvrf e2e-vrf-bad-rt 2>/dev/null || true
                exit 1
              fi
              echo "OK: invalid importRouteTarget value correctly rejected"
              echo "Server response: $OUTPUT"

    - name: reject-empty-import-route-targets
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-vrf-empty-irt
              spec:
                routerRef:
                  name: bgp-e2e-worker
                vrfID: 100
                importRouteTargets: []
                exportRouteTargets:
                  - value: "65000:100"
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: expected rejection of empty importRouteTargets but resource was accepted"
                kubectl delete bgpvrf e2e-vrf-empty-irt 2>/dev/null || true
                exit 1
              fi
              echo "OK: empty importRouteTargets correctly rejected"
              echo "Server response: $OUTPUT"

    - name: reject-empty-export-route-targets
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-vrf-empty-ert
              spec:
                routerRef:
                  name: bgp-e2e-worker
                vrfID: 100
                importRouteTargets:
                  - value: "65000:100"
                exportRouteTargets: []
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: expected rejection of empty exportRouteTargets but resource was accepted"
                kubectl delete bgpvrf e2e-vrf-empty-ert 2>/dev/null || true
                exit 1
              fi
              echo "OK: empty exportRouteTargets correctly rejected"
              echo "Server response: $OUTPUT"

    - name: reject-missing-router-ref
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-vrf-no-router
              spec:
                vrfID: 100
                importRouteTargets:
                  - value: "65000:100"
                exportRouteTargets:
                  - value: "65000:100"
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: expected rejection of missing routerRef but resource was accepted"
                kubectl delete bgpvrf e2e-vrf-no-router 2>/dev/null || true
                exit 1
              fi
              echo "OK: missing routerRef correctly rejected"
              echo "Server response: $OUTPUT"

    - name: reject-missing-vrfid
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              metadata:
                name: e2e-vrf-no-vrfid
              spec:
                routerRef:
                  name: bgp-e2e-worker
                importRouteTargets:
                  - value: "65000:100"
                exportRouteTargets:
                  - value: "65000:100"
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: expected rejection of missing vrfID but resource was accepted"
                kubectl delete bgpvrf e2e-vrf-no-vrfid 2>/dev/null || true
                exit 1
              fi
              echo "OK: missing vrfID correctly rejected"
              echo "Server response: $OUTPUT"

      finally:
        - delete:
            ref:
              apiVersion: network.datumapis.com/v1alpha1
              kind: BGPVRFInstance
              name: e2e-valid-vrf
