---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: networkrules.network.datumapis.com
spec:
  group: network.datumapis.com
  names:
    kind: NetworkRule
    listKind: NetworkRuleList
    plural: networkrules
    shortNames:
    - netrule
    singular: networkrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpcRef
      name: VPC
      type: string
    - jsonPath: .spec.protocol
      name: PROTOCOL
      type: string
    - jsonPath: .spec.port
      name: PORT
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetworkRule defines ingress load-balancing for a single tenant
          VPC/VPCAttachment, served by every NetworkGateway node identically
          (anycast Direct Server Return — see NetworkGateway's doc comment). It is
          namespaced (deployed to galactic-system) and tenant-writable; the
          vpcRef/vpcAttachmentRef fields are opaque string identifiers because the
          VPC API is owned by a separate companion operator, not this repo. An
          admission webhook (implemented by the consuming controller) must verify
          the requester is authorized for vpcRef/vpcAttachmentRef before a rule is
          accepted — see the Accepted condition.

          Unlike the earlier Full-NAT design this type originally described, there
          is no primary/secondary gateway node for a rule: every NetworkGateway
          advertises every accepted rule's vipAddresses at equal BGP preference,
          consistent-hashes the same backend list to the same backend for the same
          flow (internal/maglev), and forwards without rewriting anything —
          backend selection never needs a single "owning" node the way Full-NAT's
          SNAT-source model did.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NetworkRuleSpec defines the desired ingress load-balancing state for a
              tenant VPC/VPCAttachment.
            properties:
              backends:
                description: |-
                  Backends is the list of backend address:port targets that ingress
                  traffic matching VIPAddresses/Protocol/Port is load-balanced to.
                items:
                  description: |-
                    NetworkRuleBackend is a single backend endpoint that ingress traffic
                    matching a NetworkRule's VIP addresses is load-balanced to.
                  properties:
                    address:
                      description: Address is the backend's IPv4 or IPv6 address.
                      maxLength: 45
                      type: string
                      x-kubernetes-validations:
                      - message: address must be a valid IPv4 or IPv6 address
                        rule: isIP(self)
                    port:
                      description: Port is the backend's destination port.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - address
                  - port
                  type: object
                maxItems: 64
                minItems: 1
                type: array
              port:
                description: Port is the ingress port on VIPAddresses that this rule
                  load-balances.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              protocol:
                description: Protocol is the transport protocol matched by VIPAddresses/Port.
                enum:
                - tcp
                - udp
                type: string
              vipAddresses:
                description: |-
                  VIPAddresses is the list of ingress VIP addresses (IPv4 and/or IPv6)
                  this rule provisions on the assigned gateway node(s).
                items:
                  maxLength: 45
                  type: string
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: vipAddresses must all be valid IPv4 or IPv6 addresses
                  rule: self.all(v, isIP(v))
              vpcAttachmentRef:
                description: |-
                  VPCAttachmentRef is the opaque identifier of the target
                  VPCAttachment this rule applies to. Like VPCRef, this is an opaque
                  string reference validated by the admission webhook, not by this API.
                minLength: 1
                type: string
              vpcRef:
                description: |-
                  VPCRef is the opaque identifier of the target VPC this rule applies
                  to. This repo does not own the VPC API and does not validate the
                  identifier beyond non-emptiness; the admission webhook of the
                  consuming controller is responsible for verifying the requester is
                  authorized for this VPC before the rule is accepted.
                minLength: 1
                type: string
            required:
            - backends
            - port
            - protocol
            - vipAddresses
            - vpcAttachmentRef
            - vpcRef
            type: object
          status:
            description: NetworkRuleStatus defines the observed state of a NetworkRule.
            properties:
              conditions:
                description: Conditions contains the standard conditions for this
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
