metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: networkegresspolicies.network.datumapis.com
spec:
  group: network.datumapis.com
  names:
    kind: NetworkEgressPolicy
    listKind: NetworkEgressPolicyList
    plural: networkegresspolicies
    shortNames:
    - netegress
    singular: networkegresspolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vpcRef
      name: VPC
      type: string
    - jsonPath: .spec.vpcAttachmentRef
      name: VPC-ATTACHMENT
      type: string
    - jsonPath: .metadata.creationTimestamp
