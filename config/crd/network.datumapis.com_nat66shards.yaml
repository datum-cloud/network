---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nat66shards.network.datumapis.com
spec:
  group: network.datumapis.com
  names:
    kind: NAT66Shard
    listKind: NAT66ShardList
    plural: nat66shards
    shortNames:
    - nat66shard
    singular: nat66shard
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: TARGET
      type: string
    - jsonPath: .status.shardAddress
      name: SHARD-ADDRESS
      type: string
    - jsonPath: .status.shardSID
      name: SHARD-SID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NAT66Shard marks a single node as a member of the sharded, stateful NAT66
          egress tier (galactic-nat66) — a component deliberately kept off the
          ingress load-balancer's own consistent-hash ring (see NetworkGateway):
          tenant egress traffic (backend -> arbitrary internet destination) is a
          different traffic pattern from ingress (fixed VIP, fixed backend pool)
          and needs its own placement ring, own per-flow state, and its own
          self-routing return path, entirely independent of any NetworkGateway node.

          Every shard owns a dedicated, BGP-advertised public IPv6 address
          (Status.ShardAddress) that a flow's allocated masquerade port lives
          within — so a reply is delivered to the correct shard by ordinary
          unicast SRv6/BGP routing alone, with no hashing or cross-shard lookup on
          the return path at all (the "any node can determine the owning shard from
          the tuple alone" property, satisfied by construction rather than by a
          replicated hash table).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NAT66ShardSpec defines the desired state of a NAT66Shard.
            properties:
              targetRef:
                description: TargetRef identifies the Node this shard executes on.
                properties:
                  kind:
                    description: Kind is the target resource kind (e.g. Node).
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the target resource.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - targetRef
            type: object
          status:
            description: NAT66ShardStatus defines the observed state of a NAT66Shard.
            properties:
              conditions:
                description: Conditions contains the standard conditions for this
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
              shardAddress:
                description: |-
                  ShardAddress is this shard's own dedicated, publicly-routable IPv6
                  address — every masquerade port this shard allocates lives within it,
                  so any node can route a reply to the correct shard using ordinary
                  unicast routing on this address alone, with no per-flow state lookup
                  anywhere but the owning shard itself. Operator-supplied per shard
                  today (no in-cluster derivation mechanism yet — the same gap
                  BGPRouter.Spec.SRv6Locator/NodeID assignment has today).
                type: string
                x-kubernetes-validations:
                - message: shardAddress must be a valid IPv6 address
                  rule: self == '' || isIP(self)
              shardSID:
                description: |-
                  ShardSID is this shard's own uSID locator — a real SRv6 uSID (unlike
                  ShardAddress, a plain routable address), advertised into BGP the same
                  way any other node-reachability route is (a /128 BGPAdvertisement, no
                  VRFID/Function) so every other node learns a kernel SEG6 route toward
                  it before installing a tenant VRF's default egress route against it.
                type: string
                x-kubernetes-validations:
                - message: shardSID must be a valid IPv6 address
                  rule: self == '' || isIP(self)
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
