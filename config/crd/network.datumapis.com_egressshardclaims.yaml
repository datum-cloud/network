kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: egressshardclaims.network.datumapis.com
spec:
  group: network.datumapis.com
  names:
    kind: EgressShardClaim
    listKind: EgressShardClaimList
    plural: egressshardclaims
    shortNames:
    - egressclaim
    singular: egressshardclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.attachment.name
      name: ATTACHMENT
      type: string
    - jsonPath: .spec.vpc.name
      name: VPC
      type: string
    - jsonPath: .spec.nodeName
      name: NODE
      type: string
    - jsonPath: .status.shardRef.name
      name: SHARD
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: REASON
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
